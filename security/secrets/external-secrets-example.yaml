apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-api-secrets
  namespace: platform-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: platform-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PLATFORM_DOWNSTREAM_API_TOKEN
      remoteRef:
        key: platform/dev/platform-api
        property: downstream_api_token
    - secretKey: PLATFORM_SIGNING_KEY
      remoteRef:
        key: platform/dev/platform-api
        property: signing_key
