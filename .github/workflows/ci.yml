name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: platform-api
  GITOPS_ENV: dev
  HELM_CHART_DIR: helm/platform-api

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          echo "image_tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_repo=${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dependency resolution
        working-directory: app
        run: bash -c 'chmod +x mvnw && ./mvnw -B -ntp dependency:go-offline'

      - name: Build
        working-directory: app
        run: ./mvnw -B -ntp -DskipTests clean package

      - name: Unit tests
        working-directory: app
        run: ./mvnw -B -ntp test

      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: app/target/surefire-reports/*.xml

      - name: Static analysis
        working-directory: app
        run: ./mvnw -B -ntp -DskipTests verify -Pstatic-analysis

      - name: Dependency / security scan
        working-directory: app
        run: >
          ./mvnw -B -ntp org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7
          -Dformats=HTML,SARIF
          -DsuppressionFiles=../security/dependencies/dependency-check-suppressions.xml

      - name: Container image build
        run: >
          docker build -f docker/Dockerfile
          --build-arg GIT_SHA=${{ steps.meta.outputs.image_tag }}
          -t ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}
          app

      - name: Container image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}
          trivy-config: security/images/trivy.yaml

      - name: Registry login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tagging and registry publishing
        if: github.event_name == 'push'
        run: docker push ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}

  ecr-publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_ECR_PUBLISH == 'true' && github.event_name == 'push' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          docker pull ${{ needs.build.outputs.image_repo }}:${IMAGE_TAG}
          docker tag ${{ needs.build.outputs.image_repo }}:${IMAGE_TAG} ${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}

  gitops-update:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Bump image tag in dev values
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GITOPS_ENV: dev
        run: bash scripts/update-gitops-tag.sh
      - name: Commit and push
        run: |
          git config user.name "platform-ci"
          git config user.email "platform-ci@users.noreply.github.com"
          git add argocd/envs/dev/values.yaml
          git commit -m "ci: platform-api dev -> ${{ needs.build.outputs.image_tag }}" || exit 0
          git push
