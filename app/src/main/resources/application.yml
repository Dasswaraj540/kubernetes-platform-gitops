spring:
  application:
    name: platform-api
  lifecycle:
    timeout-per-shutdown-phase: 25s
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

platform:
  info:
    environment: ${PLATFORM_INFO_ENVIRONMENT:local}
    region: ${PLATFORM_INFO_REGION:unknown}
  items:
    seed-count: ${PLATFORM_ITEMS_SEED_COUNT:5}
    max-page-size: ${PLATFORM_ITEMS_MAX_PAGE_SIZE:50}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    io.platform.api: INFO
