apiVersion: v1
kind: Namespace
metadata:
  name: platform-prod
  labels:
    app.kubernetes.io/part-of: platform
    platform.io/environment: prod
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-prod
  namespace: platform-prod
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "120"
    count/deployments.apps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: platform-prod
  namespace: platform-prod
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: "1Gi"
      defaultRequest:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "4"
        memory: 6Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: platform-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
