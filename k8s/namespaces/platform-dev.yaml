apiVersion: v1
kind: Namespace
metadata:
  name: platform-dev
  labels:
    app.kubernetes.io/part-of: platform
    platform.io/environment: dev
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-dev
  namespace: platform-dev
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    count/deployments.apps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: platform-dev
  namespace: platform-dev
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: platform-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
