apiVersion: v1
kind: Namespace
metadata:
  name: platform-staging
  labels:
    app.kubernetes.io/part-of: platform
    platform.io/environment: staging
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-staging
  namespace: platform-staging
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "60"
    count/deployments.apps: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: platform-staging
  namespace: platform-staging
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 768Mi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      max:
        cpu: "3"
        memory: 3Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: platform-staging
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
