apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-api.stableServiceName" . }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "platform-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP
{{- if .Values.argoRollouts.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-api.canaryServiceName" . }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
    app.kubernetes.io/role: canary
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "platform-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP
{{- end }}
